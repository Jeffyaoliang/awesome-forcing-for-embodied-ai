name: Validate reviewer pilot
on:
  push:
    paths:
      - "data/reviewer-pilot.csv"
      - "reviews/**"
      - "scripts/validate_reviews.py"
      - ".github/workflows/reviewer-pilot.yml"
  pull_request:
    paths:
      - "data/reviewer-pilot.csv"
      - "reviews/**"
      - "scripts/validate_reviews.py"
      - ".github/workflows/reviewer-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check review evidence and pilot metadata
        run: python scripts/validate_reviews.py
