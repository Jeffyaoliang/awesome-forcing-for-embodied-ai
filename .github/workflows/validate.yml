name: Validate paper index
on:
  push:
    paths:
      - "data/**"
      - "scripts/validate.py"
      - "scripts/write_status.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate.py"
      - "scripts/write_status.py"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate metadata and cross-file coverage
        id: validation
        run: python scripts/validate.py
      - name: Save validation result
        if: always()
        env:
          REPORT_NAME: validation
          REPORT_RESULT: ${{ steps.validation.outcome }}
        run: python scripts/write_status.py
      - name: Commit status to main
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/validation-status.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: record validation status [skip ci]"
            git push
          fi
